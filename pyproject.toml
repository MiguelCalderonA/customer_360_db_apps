[project]
name = "customer-360-db-apps"
version = "0.1.0"
description = "Fintech BNPL customer 360 view served via Databricks Apps with REST API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "databricks-sdk>=0.40.0",
    "databricks-sql-connector>=3.5.0",
    "pydantic>=2.9.0",
    "python-multipart>=0.0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server"]
